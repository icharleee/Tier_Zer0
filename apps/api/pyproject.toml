[project]
name = "argus-api"
version = "0.1.0"
description = "ARGUS API and authoritative domain layer (ADR-0006). Slice 1: Constitutional Evidence Activation (ADR-0007, ADR-0015)."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: constitutional tests that verify database-layer enforcement and require a real PostgreSQL instance (run in CI via Docker Compose; skipped when DATABASE_URL is unset)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
