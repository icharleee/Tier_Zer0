[alembic]
script_location = migrations
# The migration identity is argus_owner (ADR-0016 Amendment 5): roles are
# provisioned by infra/db BEFORE migrations run. Override via ARGUS_MIGRATION_URL.
sqlalchemy.url = postgresql+psycopg2://argus_owner:argus_owner_dev@127.0.0.1/argus

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
